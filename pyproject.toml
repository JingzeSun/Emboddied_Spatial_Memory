[project]
name = "embodied-spatial-memory"
version = "0.1.0"
description = "CPMT contracts, development experiments, and the single-room visual pilot"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
visual-pilot = [
  "ai2thor>=5,<6",
  "pillow>=11,<13",
  "prior>=1,<2",
  "psutil>=6,<8",
]

[tool.uv]
package = false
