contract_version: cpmt-0.2
status: proposed
stage: M0

method:
  system_name: CPMT
  learning_mechanism: CTL
  domain: embodied_spatial_memory

transaction:
  intents: [PRESERVE, ASSOCIATE, EXPAND, REVISE]
  templates: [NOOP, BIND, BIRTH, REACTIVATE, RELINK, RETRACT, SPLIT, MERGE, COMPOSITE]
  identity_lifecycle: [candidate, confirmed, dormant, retracted, alias]
  version_closure_field: valid_to
  bind_target_lifecycle: [candidate, confirmed]
  reactivate_target_lifecycle: [dormant]
  retracted_reactivation_allowed: false
  implicit_candidate_promotion: false
  candidate_confirmation:
    explicit_within_bind: true
    minimum_unique_evidence: 2
    independent_view_numeric_rule: pending_m2_validation
  dormancy:
    learned_transaction: false
    inactivity_horizon: pending_validation
    preserves_identity_latent_evidence_history: true
  split:
    old_identity: retracted
    successor_lifecycle: candidate
    evidence_partition: exact_once
    inherit_conflated_latent: false
  merge:
    require_confirmed_source: true
    canonical_rule: earliest_valid_from_then_lexicographic_node_id
    noncanonical_lifecycle: alias
    preserve_history: true
  retract:
    default_target: fact_version
    node_retract_from_visible_empty: false
    minimum_visible_empty_events: 2
    distinct_key: [time_index, viewpoint_id]
    require_pose_valid: true
    require_depth_valid: true
    forbid_intervening_positive: true
    m0_oracle_reliability: 1.0
    m2_reliability_threshold: pending_validation
  replace:
    components: [RETRACT, BIRTH, ADD_EDGE]
    preserves_old_identity: true
  composite_labels:
    REPLACE: [RETRACT, BIRTH]
  candidate_budget: 16
  candidate_generator: deterministic
  destructive_delete_allowed: false
  default_on_invalid: reject
  low_confidence_wrapper: QUARANTINE
  quarantine_mutates_world: false
  quarantine:
    commit_probability: pending_validation
    top_two_margin: pending_validation
    relevant_opportunity_budget: pending_validation
    raw_frame_ttl: null
    unresolved_terminal_state: archived_unresolved
    archive_deletes_evidence: false
    searchable_states: [active_pending, archived_unresolved]
    consume_requires_evidence_refs: true

executor:
  deterministic: true
  immutable_base_version: true
  atomic_rollback: true
  enforce_protected_ids: true
  require_provenance: true
  require_idempotency: true
  hash_algorithm: sha256

representation:
  name: Projective_Node_Orbit
  backbone: frozen_dino_family
  region_proposals: fixed
  depth: fixed_input
  pose: fixed_input
  use_projective_transport: true
  use_visibility: true
  vp_is_world_coordinate: false

counterfactual:
  horizon: pending_validation
  temperature: pending_validation
  online_future_access: false
  # D-026: agreed protocol only; online model/enforcement is not implemented.
  online_decision_mode: immediate
  fixed_lookahead_frames: 0
  revise_after_observation_arrival: true
  delayed_one_frame_comparison: deferred
  energy:
    now_weight: 1.0
    future_weight: 1.0
    edit_weight: pending_validation
    growth_weight: pending_validation
    collateral_weight: pending_validation
    illegal_policy: mask_before_softmax
  store_component_scores: true

equivalence:
  identity_correspondence: implemented_m0
  unlisted_old_ids_fixed: true
  declared_old_exchangeability: true
  local_new_id_bijection: strict
  new_to_old_mapping: forbidden
  raw_latent_exact_match: false
  comparison_mode: canonical_memory_state
  future_projection_defines_equivalence: false
  decision_relevant_fields: strict_after_canonicalization
  audit_only_names: ignored_but_retained_in_source

training:
  trainable: [future_scorer, online_transaction_model]
  frozen: [backbone, depth, pose, region_proposals, candidate_generator, executor]
  label_fractions: [0.0, 0.01, 0.10, 1.0]

data:
  dataset_version: unassigned
  group_keys: [paired_group_id, world_seed, asset_family]
  test_sealed: true
  online_export_excludes: [future_evidence, oracle_equivalence, simulator_hidden_state]

evaluation:
  methods: [cpmt_ctl_core, direct_classifier, direct_future_loss, execute_current_only, future_no_execution, oracle]
  primary_contrasts: [cpmt_ctl_core_vs_direct_future_loss, cpmt_ctl_core_vs_future_no_execution]
  primary_metrics: [post_graph_correctness, memory_contamination, false_birth_growth, collateral_violation]
  formal_seeds: 5
  bootstrap_confidence: 0.95
  numeric_gates: pending_before_test

scope_lock:
  active_disambiguation: excluded_first_paper
  second_domain: excluded_first_paper
  learned_candidate_generator: excluded_first_paper
  end_to_end_backbone: excluded_first_paper
  navigation: excluded_first_paper

research_integrity:
  current_human_decision: HC-003
  claim_status: proposed
  implementation_status: m0_contract_complete
  validation_status: contract_tests_only
